<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages taking a deployment to a verdict: environment, capsule, seal, activation, grant, surface, policy, verdict. The environment yields a machine fingerprint. A capsule is loaded and its integrity checked, a seal is verified, and an activation state is read. From those four signals a grant is derived with a one-hour lifetime, and if any signal is missing the derivation returns no grant rather than a partial one. The grant is matched to one of five deployment surfaces, each of which lists the entitlements it is allowed to ask for. The policy layer then evaluates four rules through four evaluators covering compound entitlements, rate limits, cooldowns and session requirements. A gate returns its verdict. Seven named gates sit on the entitlements the surfaces expose. Three outcomes: a call authorized because the grant covers the gate, a call held back by a rate limit or cooldown even though the grant is valid, and a call denied because there is no grant or the surface never carried that entitlement."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">THE BOUNDARY ANSWERS TO THE MACHINE IT RUNS ON, NOT TO A TOKEN PASTED IN FROM SOMEWHERE ELSE</text><text class="h" x="44" y="72">How a deployment earns authorization, or is denied</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 206V228H143.25V213"/><text class="k" x="480" y="245" text-anchor="middle" fill="var(--drift)">A MISSING SIGNAL DERIVES NO GRANT</text><path class="back" marker-end="url(#ab)" d="M592.25 398V420H143.25V405"/><text class="k" x="367.75" y="437" text-anchor="middle" fill="var(--drift)">POLICY RE-CHECKS EVERY CALL</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Environment</text><text class="s" x="58" y="168">A machine fingerprint.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Capsule</text><text class="s" x="282.5" y="168">Loaded, and its integrity</text><text class="s" x="282.5" y="183">checked.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Seal</text><text class="s" x="507" y="168">Verified, or it is absent.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Activation</text><text class="s" x="731.5" y="168">The state, read.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Grant</text><text class="s" x="58" y="360">Derived, with a one-hour life.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Surface</text><text class="s" x="282.5" y="360">One of five, each with its</text><text class="s" x="282.5" y="375">list.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Policy</text><text class="s" x="507" y="360">Four rules, four evaluators.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Verdict</text><text class="s" x="731.5" y="360">One of seven gates answers.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">AUTHORIZED</text><text class="s" x="58" y="509" font-size="10.5">the grant covers this gate</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">POLICY-HELD</text><text class="s" x="357.33" y="509" font-size="10.5">a rate limit or a cooldown</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">DENIED</text><text class="s" x="656.67" y="509" font-size="10.5">no grant, or no entitlement</text><text class="s" x="44" y="546">Authorization is derived from the environment rather than fetched from a server, so a copied capsule on the wrong machine derives a different fingerprint and no grant. The policy layer is checked on every call because rate and cooldown limits are about how often a gate is used, not about whether the grant exists, so a valid grant can still be held back.</text></svg>
