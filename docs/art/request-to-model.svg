<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages carrying an operator request to a model: input, obfuscation, categories, vocabulary, semantic, cyber, prose, framed request. The raw text is first checked for obfuscation, so leetspeak and homoglyph spacing are normalized before anything reads it. Category detection sorts the text across fourteen content categories. Vocabulary substitution applies a table of rules that swap operational terminology for a consulting register. Semantic modulation runs a five-layer pass with one framing template per category. Cyber modulation maps terminology for twelve assessment phases onto their published equivalents. Prose calibration normalizes register across the whole text against a large multilingual table. The authorization frame is built during the semantic and cyber passes and prepended once at the very top, so it rides on top of the request rather than being woven through it. Research mode is a separate path: a caller who wants no rewrite sends the source text through unchanged, which is why the native path returns to the input. Three outcomes: a request rewritten, framed and sent; a request the caller chose to send natively; and a request the authority gate refused before any layer ran."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">A PROVIDER READS REGISTER, NOT AUTHORIZATION, SO THE REGISTER IS WHAT THE BOUNDARY CHANGES</text><text class="h" x="44" y="72">How an operator request reaches a model, or is sent unchanged</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 206V228H143.25V213"/><text class="k" x="480" y="245" text-anchor="middle" fill="var(--drift)">RESEARCH MODE SENDS IT UNCHANGED</text><path class="back" marker-end="url(#ab)" d="M367.75 398V420H143.25V405"/><text class="k" x="255.5" y="437" text-anchor="middle" fill="var(--drift)">ONE FRAME FROM SEMANTIC AND CYBER</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Input</text><text class="s" x="58" y="168">The operator's raw request.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Obfuscation</text><text class="s" x="282.5" y="168">Leetspeak and spacing,</text><text class="s" x="282.5" y="183">normalized.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Categories</text><text class="s" x="507" y="168">Sorted across fourteen.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Vocabulary</text><text class="s" x="731.5" y="168">Operational terms, swapped.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Semantic</text><text class="s" x="58" y="360">Five layers, one frame per</text><text class="s" x="58" y="375">category.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Cyber</text><text class="s" x="282.5" y="360">Twelve phases, mapped by name.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Prose</text><text class="s" x="507" y="360">Register, evened across the</text><text class="s" x="507" y="375">text.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Framed request</text><text class="s" x="731.5" y="360">The frame prepended, then</text><text class="s" x="731.5" y="375">sent.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">CALIBRATED</text><text class="s" x="58" y="509" font-size="10.5">rewritten, framed and sent</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">NATIVE</text><text class="s" x="357.33" y="509" font-size="10.5">research mode, unchanged</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">REFUSED</text><text class="s" x="656.67" y="509" font-size="10.5">the authority gate said no</text><text class="s" x="44" y="546">The stack rewrites the register and never the meaning, and it never asks the model for anything the operator was not already authorized to request. Research mode exists so a caller who does not want the rewrite can send the source text through untouched, which is why the passthrough path returns to the input rather than skipping a layer.</text></svg>
