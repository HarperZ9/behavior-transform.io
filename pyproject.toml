[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "behavior-transform"
version = "0.1.0"
description = "IO boundary calibration layer for AI-assisted workspaces"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
behavior-transform = "tools.behavior_flagship:main"
behavior-transform-io = "tools.behavior_flagship:main"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
